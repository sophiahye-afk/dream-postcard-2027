<style>
:root{--bg:#F7F4F1;--panel:#FFFFFF;--ink:#1E1B19;--muted:#5E5752;--line:#E6DFD8;--o:#F37021;--o3:#B4480B;--o2:rgba(243,112,33,.10);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161311;--panel:#221E1B;--ink:#F3EEEA;--muted:#B4ABA4;--line:#3A3430;--o3:#FFB07D;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left,0px)) 56px;display:flex;flex-direction:column;gap:28px}
a.back{color:var(--o3);font-weight:800;text-decoration:none}
h1{font-size:26px;margin:4px 0 0}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:18px}
.grid.phones{grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr))}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
figure img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff}
figcaption b{display:block;font-size:15.5px}
figcaption span{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.homebtn{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:20;font-size:14px;font-weight:800;border-radius:999px;padding:12px 18px;background:var(--o);color:#fff;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
</style></head><body>
